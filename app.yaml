name: frederick-cas
domains:
- domain: ${DOMAIN}
  type: PRIMARY

services:
- name: api
  github:
    repo: adamcamp/frederick-cas
    branch: develop
    deploy_on_push: true
  dockerfile_path: Dockerfile
  envs:
  - key: RAILS_ENV
    scope: RUN_TIME
    value: production
  - key: SECRET_KEY_BASE
    scope: RUN_TIME
    value: ${SECRET_KEY_BASE}
  - key: DATABASE_SSLMODE
    scope: RUN_TIME
    value: require
  - key: DATABASE_MAINTENANCE_DB
    scope: RUN_TIME
    value: db
  - key: DATABASE_URL
    scope: RUN_TIME
    value: postgres://${db.USERNAME}:${db.PASSWORD}@${db.HOSTNAME}:${db.PORT}/${db.DATABASE}
  - key: REDIS_URL
    scope: RUN_TIME
    value: redis://${cache.USERNAME}:${cache.PASSWORD}@${cache.HOSTNAME}:${cache.PORT}
  - key: HOSTNAME
    scope: RUN_TIME
    value: ${DOMAIN}
  - key: FQDN
    scope: RUN_TIME
    value: ${DOMAIN}
  - key: CLIENT
    scope: RUN_TIME
    value: Frederick CAS
  - key: TIMEZONE
    scope: RUN_TIME
    value: America/New_York
  - key: DEFAULT_FROM
    scope: RUN_TIME
    value: '"No Reply" <no-reply@${EMAIL_DOMAIN}>'
  - key: SMTP_SERVER
    scope: RUN_TIME
    value: smtp.sendgrid.net
  - key: SMTP_DOMAIN
    scope: RUN_TIME
    value: ${DOMAIN}
  - key: SMTP_PORT
    scope: RUN_TIME
    value: "587"
  - key: SENDGRID_API_KEY
    scope: RUN_TIME
    value: ${SENDGRID_API_KEY}
  http_port: 3000
  health_check:
    http_path: /health
  routes:
  - path: /api
    preserve_path_prefix: false
  run_command: |
    bundle exec rake db:create db:migrate
    exec bundle exec puma -c config/puma.rb

- name: warehouse
