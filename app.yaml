  - key: REPORTING_DATABASE_DB
    scope: RUN_TIME
    value: frederick_reporting_production
  - key: REPORTING_DATABASE_HOST
    scope: RUN_TIME
    value: ${db.HOSTNAME}
  - key: REPORTING_DATABASE_PORT
    scope: RUN_TIME
    value: ${db.PORT}
  - key: REPORTING_DATABASE_USER
    scope: RUN_TIME
    value: ${db.USERNAME}
  - key: REPORTING_DATABASE_PASS
    scope: RUN_TIME
    value: ${db.PASSWORD}
  - key: CAS_DATABASE_ADAPTER
    scope: RUN_TIME
    value: postgresql
  - key: CAS_DATABASE_DB
    scope: RUN_TIME
