  http_port: 3000
  health_check:
    http_path: /health
  routes:
  - path: /warehouse
    preserve_path_prefix: true
  run_command: |
    bundle exec rake db:migrate
    exec bundle exec puma -c config/puma.rb

static_sites:
- name: web
  github:
    repo: adamcamp/hmis-frontend
    branch: develop
    deploy_on_push: true
  build_command: HUSKY=0 yarn install --frozen-lockfile && yarn build
  output_dir: dist
  envs:
  - key: VITE_APP_URL
    value: https://${FRONTEND_DOMAIN}
  - key: VITE_API_URL
    value: https://${CAS_DOMAIN}/graphql
  - key: VITE_WAREHOUSE_URL
    value: https://${WAREHOUSE_DOMAIN}

databases:
- name: db
  engine: PG
  version: "14"

- name: cache
  engine: VALKEY
  version: "8"
  production: true
  cluster_name: ${CACHE_CLUSTER_NAME}

envs:
# Shared environment variables
- key: RAILS_LOG_TO_STDOUT
  scope: RUN_TIME
  value: "true"
- key: MAIL_DELIVERY_METHOD
  scope: RUN_TIME
  value: smtp
