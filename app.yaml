name: frederick-cas
services:
- name: api
  github:
    repo: adamcamp/frederick-cas
    branch: develop
    deploy_on_push: true
  dockerfile_path: Dockerfile
  envs:
  - key: RAILS_ENV
    scope: RUN_TIME
    value: production
  - key: RAILS_MASTER_KEY
    scope: RUN_AND_BUILD_TIME
    value: ${RAILS_MASTER_KEY}
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${db.username}:${db.password}@${db.host}:${db.port}/frederick_cas_production
  - key: REDIS_URL
    scope: RUN_TIME
    value: redis://${cache.username}:${cache.password}@${cache.host}:${cache.port}
  - key: HOSTNAME
    scope: RUN_TIME
    value: ${CAS_DOMAIN}
  - key: FQDN
    scope: RUN_TIME
    value: ${CAS_DOMAIN}
  - key: CLIENT
    scope: RUN_TIME
    value: Frederick CAS
  - key: TIMEZONE
    scope: RUN_TIME
    value: America/New_York
  - key: DEFAULT_FROM
    scope: RUN_TIME
    value: '"No Reply" <no-reply@${EMAIL_DOMAIN}>'
  - key: SMTP_SERVER
    scope: RUN_TIME
    value: smtp.sendgrid.net
  - key: SMTP_DOMAIN
    scope: RUN_TIME
    value: ${CAS_DOMAIN}
  - key: SMTP_PORT
    scope: RUN_TIME
    value: "587"
  - key: SENDGRID_API_KEY
    scope: RUN_TIME
    value: ${SENDGRID_API_KEY}
  http_port: 3000
  health_check:
    http_path: /health
  routes:
  - path: /
    preserve_path_prefix: true
  run_command: |
    bundle exec rake db:migrate
    exec bundle exec puma -c config/puma.rb

- name: warehouse
